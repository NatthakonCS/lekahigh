<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสรุปยอดบัญชี</title>
    <!-- โหลด LIFF SDK, Chart.js และ Tailwind CSS (สำหรับทำ UI ให้สวยงาม) -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- โหลดฟอนต์ภาษาไทย -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #F3F4F6; }
    </style>
</head>
<body class="text-gray-800 pb-10">

    <!-- แถบด้านบน -->
    <div class="bg-blue-600 text-white text-center p-5 rounded-b-3xl shadow-lg sticky top-0 z-10">
        <h2 class="text-xl font-semibold">📊 แดชบอร์ดการเงิน</h2>
    </div>
    
    <div id="loading" class="text-center mt-20 text-gray-500 animate-pulse">
        กำลังโหลดข้อมูล... ⏳
    </div>

    <!-- ส่วนเนื้อหาหลัก (ซ่อนไว้ก่อนจนกว่าจะโหลดเสร็จ) -->
    <div class="max-w-md mx-auto mt-6 px-4 hidden" id="dashboard">
        
        <!-- การ์ดสรุปยอดรวม (รายรับ - รายจ่าย) -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-green-500">
                <p class="text-xs text-gray-500 mb-1">รายรับรวม</p>
                <p class="text-lg font-bold text-green-600" id="totalIncome">0 ฿</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-red-500">
                <p class="text-xs text-gray-500 mb-1">รายจ่ายรวม</p>
                <p class="text-lg font-bold text-red-600" id="totalExpense">0 ฿</p>
            </div>
        </div>

        <!-- กราฟวงกลม -->
        <div class="bg-white p-5 rounded-2xl shadow-sm mb-6">
            <h3 class="text-md font-semibold text-gray-700 mb-4 text-center">สัดส่วนรายจ่ายทั้งหมด</h3>
            <canvas id="myChart"></canvas> 
        </div>

        <!-- ประวัติรายการย้อนหลัง -->
        <div class="bg-white p-5 rounded-2xl shadow-sm">
            <h3 class="text-md font-semibold text-gray-700 mb-4">ประวัติล่าสุด (10 รายการ)</h3>
            <div id="historyList" class="flex flex-col gap-3">
                <!-- โค้ด JavaScript จะเอาประวัติมาแทรกตรงนี้ -->
            </div>
        </div>

    </div>

    <script>
        async function main() {
            try {
                // 🛑 เปลี่ยนเป็น LIFF ID ของคุณฟิว
                await liff.init({ liffId: "2011471625-4VRpJIDF" });
                
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    fetchData(profile.userId); 
                } else {
                    liff.login();
                }
            } catch (err) {
                console.error("LIFF Init Error: ", err);
                document.getElementById('loading').innerText = "❌ เกิดข้อผิดพลาดในการเชื่อมต่อระบบ";
            }
        }

        async function fetchData(userId) {
            try {
                const response = await fetch(`/api/data?userId=${userId}`);
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboard').classList.remove('hidden');

                renderDashboard(data); 
            } catch (error) {
                console.error("Fetch Data Error: ", error);
            }
        }

        function renderDashboard(data) {
            let totalInc = 0;
            let totalExp = 0;
            let expenseCategories = {}; // เก็บยอดแยกตามหมวดหมู่เพื่อวาดกราฟ

            // 1. คำนวณยอดรวม และจัดกลุ่มข้อมูล
            data.forEach(item => {
                if (item.category === 'รายรับ') {
                    totalInc += item.amount;
                } else {
                    totalExp += item.amount;
                    // รวมยอดรายจ่ายแต่ละหมวดหมู่
                    if (expenseCategories[item.category]) {
                        expenseCategories[item.category] += item.amount;
                    } else {
                        expenseCategories[item.category] = item.amount;
                    }
                }
            });

            // อัปเดตตัวเลขในการ์ดสรุปยอด
            document.getElementById('totalIncome').innerText = totalInc.toLocaleString() + ' ฿';
            document.getElementById('totalExpense').innerText = totalExp.toLocaleString() + ' ฿';

            // 2. วาดกราฟ
            const ctx = document.getElementById('myChart').getContext('2d');
            const bgColors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40'];
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(expenseCategories), // ดึงชื่อหมวดหมู่มาเป็นป้ายกำกับ
                    datasets: [{
                        data: Object.values(expenseCategories), // ดึงยอดเงิน
                        backgroundColor: bgColors.slice(0, Object.keys(expenseCategories).length),
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, cutout: '70%' }
            });

            // 3. แสดงประวัติ 10 รายการล่าสุด
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = ''; // ล้างของเก่า

            // เลือกมาแค่ 10 อันดับแรก
            const recentData = data.slice(0, 10);
            
            recentData.forEach(item => {
                const isIncome = item.category === 'รายรับ';
                const textColor = isIncome ? 'text-green-600' : 'text-red-500';
                const sign = isIncome ? '+' : '-';
                const icon = item.wallet_type === 'personal' ? '🏠' : '🏢';
                
                // แปลงวันที่ให้อ่านง่าย
                const dateObj = new Date(item.created_at);
                const dateStr = dateObj.toLocaleDateString('th-TH', { month: 'short', day: 'numeric' });
                const timeStr = dateObj.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

                historyList.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <div class="flex items-center gap-3">
                            <div class="text-2xl">${icon}</div>
                            <div>
                                <p class="font-semibold text-gray-800 text-sm">${item.category}</p>
                                <p class="text-xs text-gray-400">${dateStr} • ${timeStr}</p>
                            </div>
                        </div>
                        <div class="font-bold ${textColor}">
                            ${sign}${item.amount.toLocaleString()} ฿
                        </div>
                    </div>
                `;
            });
        }

        main();
    </script>
</body>
</html>
