<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบัญชีของฉัน</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #F3F4F6; } </style>
</head>
<body class="text-gray-800 pb-20">

    <!-- แถบด้านบนและเมนูนำทาง -->
    <div class="bg-blue-600 text-white text-center p-5 rounded-b-3xl shadow-lg sticky top-0 z-10">
        <h2 class="text-xl font-semibold">บัญชีส่วนตัว</h2>
        <div class="flex justify-center mt-3 gap-4">
            <button onclick="switchTab('dashboard')" id="btn-dashboard" class="px-4 py-1 bg-white text-blue-600 rounded-full font-bold text-sm">📊 แดชบอร์ด</button>
            <button onclick="switchTab('settings')" id="btn-settings" class="px-4 py-1 bg-blue-500 text-white rounded-full font-bold text-sm opacity-80">⚙️ ตั้งค่า</button>
        </div>
    </div>
    
    <div id="loading" class="text-center mt-20 text-gray-500 animate-pulse">กำลังโหลดข้อมูล... ⏳</div>

    <!-- หน้า 1: แดชบอร์ด (เอาไว้ดูสรุปเหมือนเดิม) -->
    <div class="max-w-md mx-auto mt-6 px-4 hidden" id="dashboard">
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-green-500">
                <p class="text-xs text-gray-500 mb-1">รายรับรวม</p>
                <p class="text-lg font-bold text-green-600" id="totalIncome">0 ฿</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-red-500">
                <p class="text-xs text-gray-500 mb-1">รายจ่ายรวม</p>
                <p class="text-lg font-bold text-red-600" id="totalExpense">0 ฿</p>
            </div>
        </div>
        <div class="bg-white p-5 rounded-2xl shadow-sm mb-6">
            <h3 class="text-md font-semibold text-gray-700 mb-4 text-center">สัดส่วนรายจ่าย</h3>
            <canvas id="myChart"></canvas> 
        </div>
    </div>

    <!-- หน้า 2: ตั้งค่าหมวดหมู่ -->
    <div class="max-w-md mx-auto mt-6 px-4 hidden" id="settings">
        <!-- ฟอร์มเพิ่มหมวดหมู่ -->
        <div class="bg-white p-5 rounded-2xl shadow-sm mb-6">
            <h3 class="text-md font-semibold text-gray-700 mb-4">➕ เพิ่มหมวดหมู่ใหม่</h3>
            <select id="newWallet" class="w-full mb-3 p-2 border rounded-lg bg-gray-50">
                <option value="personal">🏠 กระเป๋าส่วนตัว</option>
                <option value="business">🏢 กระเป๋าร้านค้า</option>
            </select>
            <input type="text" id="newCategory" placeholder="ชื่อหมวดหมู่ (เช่น ช้อปปิ้ง, ค่าน้ำไฟ)" class="w-full mb-3 p-2 border rounded-lg bg-gray-50">
            <input type="number" id="newLimit" placeholder="ตั้งงบจำกัดต่อเดือน (ใส่ 0 คือไม่จำกัด)" class="w-full mb-3 p-2 border rounded-lg bg-gray-50">
            <button onclick="addCategory()" class="w-full bg-green-500 text-white font-bold py-2 rounded-lg shadow">บันทึกหมวดหมู่</button>
        </div>

        <!-- รายการหมวดหมู่ที่มีอยู่ -->
        <div class="bg-white p-5 rounded-2xl shadow-sm">
            <h3 class="text-md font-semibold text-gray-700 mb-4">📝 หมวดหมู่ของคุณ</h3>
            <div id="categoryList" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <script>
        let myUserId = '';
        let myChartInstance = null;

        async function main() {
            try {
                await liff.init({ liffId: "2011471625-4VRpJIDF" }); // 🛑 แก้ ID ตรงนี้
                if (liff.isLoggedIn()) {
                    myUserId = (await liff.getProfile()).userId;
                    fetchData(myUserId); 
                    fetchCategories(myUserId);
                } else { liff.login(); }
            } catch (err) { console.error(err); }
        }

        // --- ระบบสลับหน้าเว็บ ---
        function switchTab(tab) {
            document.getElementById('dashboard').style.display = tab === 'dashboard' ? 'block' : 'none';
            document.getElementById('settings').style.display = tab === 'settings' ? 'block' : 'none';
            
            document.getElementById('btn-dashboard').className = tab === 'dashboard' ? 'px-4 py-1 bg-white text-blue-600 rounded-full font-bold text-sm' : 'px-4 py-1 bg-blue-500 text-white rounded-full font-bold text-sm opacity-80';
            document.getElementById('btn-settings').className = tab === 'settings' ? 'px-4 py-1 bg-white text-blue-600 rounded-full font-bold text-sm' : 'px-4 py-1 bg-blue-500 text-white rounded-full font-bold text-sm opacity-80';
        }

        // --- ดึงข้อมูลสรุปยอด (แดชบอร์ด) ---
        async function fetchData(userId) {
            const response = await fetch(`/api/data?userId=${userId}`);
            const data = await response.json();
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            renderDashboard(data); 
        }

        function renderDashboard(data) {
            let totalInc = 0, totalExp = 0, expCats = {};
            data.forEach(item => {
                if (item.category === 'รายรับ') totalInc += item.amount;
                else {
                    totalExp += item.amount;
                    expCats[item.category] = (expCats[item.category] || 0) + item.amount;
                }
            });
            document.getElementById('totalIncome').innerText = totalInc.toLocaleString() + ' ฿';
            document.getElementById('totalExpense').innerText = totalExp.toLocaleString() + ' ฿';

            if(myChartInstance) myChartInstance.destroy();
            myChartInstance = new Chart(document.getElementById('myChart').getContext('2d'), {
                type: 'doughnut',
                data: { labels: Object.keys(expCats), datasets: [{ data: Object.values(expCats), backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF'] }] }
            });
        }

        // --- ระบบดึง/เพิ่ม/ลบ หมวดหมู่ ---
        async function fetchCategories(userId) {
            const res = await fetch(`/api/categories?userId=${userId}`);
            const cats = await res.json();
            const list = document.getElementById('categoryList');
            list.innerHTML = '';
            cats.forEach(c => {
                const icon = c.wallet_type === 'personal' ? '🏠' : '🏢';
                const limitTxt = c.monthly_limit > 0 ? `<span class="text-xs text-red-500">งบ: ${c.monthly_limit.toLocaleString()}฿</span>` : '';
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                        <div><p class="font-semibold text-gray-800 text-sm">${icon} ${c.category_name}</p>${limitTxt}</div>
                        ${c.category_name !== 'รายรับ' ? `<button onclick="deleteCategory('${c.wallet_type}', '${c.category_name}')" class="text-red-500 text-sm font-bold bg-red-100 px-2 py-1 rounded">ลบ</button>` : ''}
                    </div>`;
            });
        }

        async function addCategory() {
            const wallet = document.getElementById('newWallet').value;
            const catName = document.getElementById('newCategory').value;
            const limit = document.getElementById('newLimit').value || 0;
            
            if(!catName) return alert('กรุณาพิมพ์ชื่อหมวดหมู่');
            
            await fetch('/api/categories', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: myUserId, wallet_type: wallet, category_name: catName, monthly_limit: parseInt(limit) })
            });
            
            document.getElementById('newCategory').value = '';
            document.getElementById('newLimit').value = '';
            fetchCategories(myUserId); // รีเฟรชรายการ
            alert('บันทึกเรียบร้อย! ลองพิมพ์ตัวเลขในแชทดูได้เลยครับ');
        }

        async function deleteCategory(wallet, catName) {
            if(confirm(`ต้องการลบหมวดหมู่ "${catName}" ใช่ไหม?`)) {
                await fetch('/api/categories', {
                    method: 'DELETE', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ userId: myUserId, wallet_type: wallet, category_name: catName })
                });
                fetchCategories(myUserId);
            }
        }

        main();
    </script>
</body>
</html>
